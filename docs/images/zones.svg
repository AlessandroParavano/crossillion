<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 488" width="1000" height="488" role="img" aria-label="The five zones of the descent and the depth each begins at">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a1f"/><stop offset=".55" stop-color="#15104a"/><stop offset="1" stop-color="#090c28"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#c8872a"/></linearGradient>
  <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#8aa4ff" fill-opacity=".07"/></pattern><linearGradient id="z0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9ae6"/><stop offset="1" stop-color="#bfe3f7"/></linearGradient><linearGradient id="z1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4331"/><stop offset="1" stop-color="#2f1f17"/></linearGradient><linearGradient id="z2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a47"/><stop offset="1" stop-color="#12132a"/></linearGradient><linearGradient id="z3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f2013"/><stop offset="1" stop-color="#150d08"/></linearGradient><linearGradient id="z4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#fff4c9"/></linearGradient><clipPath id="frame"><rect width="1000" height="488" rx="18"/></clipPath>
<clipPath id="bandclip"><rect x="170" y="70" width="782" height="390" rx="12"/></clipPath></defs>
<style>.you{animation:you 11s cubic-bezier(.45,0,.2,1) infinite alternate}@keyframes you{from{transform:translateY(0)}to{transform:translateY(386px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="1000" height="488" fill="url(#bg)"/><rect width="1000" height="488" fill="url(#scan)"/>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="38" font-size="12.5" font-weight="700" letter-spacing="3" fill="#c8a85a">THE DESCENT, ZONE BY ZONE</text>
<rect x="48" y="50" width="56" height="3" rx="1.5" fill="url(#goldh)"/>
<g clip-path="url(#bandclip)"><rect x="170" y="70" width="782" height="78" fill="url(#z0)"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="104" font-size="21" font-weight="800" fill="#0b1230">The Sunday Street</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="127" font-size="13" font-style="italic" fill="#26407a">Where everyone starts</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="934" y="114.0" text-anchor="end" font-size="12" font-weight="700" fill="#26407a">to 200 m</text><rect x="170" y="148" width="782" height="78" fill="url(#z1)"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="182" font-size="21" font-weight="800" fill="#f4efe2">The Nave</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="205" font-size="13" font-style="italic" fill="#d8b98f">Pews, candles and stained glass</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="934" y="192.0" text-anchor="end" font-size="12" font-weight="700" fill="#d8b98f">to 1,000 m</text><rect x="170" y="226" width="782" height="78" fill="url(#z2)"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="260" font-size="21" font-weight="800" fill="#f4efe2">The Crypt</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="283" font-size="13" font-style="italic" fill="#aab3e6">Beneath the altar, the saints sleep</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="934" y="270.0" text-anchor="end" font-size="12" font-weight="700" fill="#aab3e6">to 4,000 m</text><rect x="170" y="304" width="782" height="78" fill="url(#z3)"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="338" font-size="21" font-weight="800" fill="#f4efe2">The Catacombs</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="361" font-size="13" font-style="italic" fill="#d9b27a">Where the first Christians hid and prayed</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="934" y="348.0" text-anchor="end" font-size="12" font-weight="700" fill="#d9b27a">to 6,000 m</text><rect x="170" y="382" width="782" height="78" fill="url(#z4)"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="416" font-size="21" font-weight="800" fill="#2a1b04">The Holy of Holies</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="196" y="439" font-size="13" font-style="italic" fill="#6b4a10">Deep calls to deep</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="934" y="426.0" text-anchor="end" font-size="12" font-weight="700" fill="#6b4a10">and below</text></g><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="48" y="114.0" font-size="15" font-weight="700" fill="#aac3ff">0 m</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="48" y="192.0" font-size="15" font-weight="700" fill="#aac3ff">200 m</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="48" y="270.0" font-size="15" font-weight="700" fill="#aac3ff">1,000 m</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="48" y="348.0" font-size="15" font-weight="700" fill="#aac3ff">4,000 m</text><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="48" y="426.0" font-size="15" font-weight="700" fill="#aac3ff">6,000 m</text>
<line x1="150" y1="70" x2="150" y2="460" stroke="#aac3ff" stroke-opacity=".7" stroke-width="2"/><line x1="150" y1="70" x2="164" y2="70" stroke="#aac3ff" stroke-width="1.6"/><line x1="150" y1="148" x2="164" y2="148" stroke="#aac3ff" stroke-width="1.6"/><line x1="150" y1="226" x2="164" y2="226" stroke="#aac3ff" stroke-width="1.6"/><line x1="150" y1="304" x2="164" y2="304" stroke="#aac3ff" stroke-width="1.6"/><line x1="150" y1="382" x2="164" y2="382" stroke="#aac3ff" stroke-width="1.6"/><line x1="150" y1="460" x2="164" y2="460" stroke="#aac3ff" stroke-width="1.6"/>
<g class="you"><g transform="translate(0 72)"><path d="M126 -7 L143 0 L126 7 Z" fill="#ff5a7a"/><line x1="104" y1="0" x2="126" y2="0" stroke="#ff5a7a" stroke-width="2"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="70" y="4" font-size="11" font-weight="700" letter-spacing="1" fill="#ff5a7a">YOU</text></g></g>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="474" font-size="11" fill="#6f7bb0">A perfect game of seven top-tier answers reaches 7,000 m.</text></g>
