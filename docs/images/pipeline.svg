 d="M7 20V12M13 20V5M19 20v-5" stroke-linecap="round"/></g><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="500.0" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Ranking</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="500.0" y="158" text-anchor="middle" font-size="11" fill="#aab3e6">inside each question</text></g><line class="flow" x1="581" y1="125.0" x2="605" y2="125.0" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/><path d="M605 120.0 l8 5 -8 5z" fill="#f2c14e"/><g class="fade" style="animation-delay:0.45s"><rect x="613" y="66" width="150" height="118" rx="14" fill="#0e1138" stroke="#f2c14e" stroke-opacity=".45"/><g transform="translate(673.0 82)" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linejoin="round"><ellipse cx="15" cy="7" rx="7" ry="3"/><path d="M8 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/></g><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="688.0" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">data/answers.js</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="688.0" y="158" text-anchor="middle" font-size="11" fill="#aab3e6">built by tools/build.py</text></g><line class="flow" x1="769" y1="125.0" x2="793" y2="125.0" stroke="#f2c14e" stroke-width="2" stroke-linecap="round"/><path d="M793 120.0 l8 5 -8 5z" fill="#f2c14e"/><g class="fade" style="animation-delay:0.60s"><rect x="801" y="66" width="150" height="118" rx="14" fill="#0e1138" stroke="#f2c14e" stroke-opacity=".45"/><g transform="translate(861.0 82)" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linejoin="round"><g transform="translate(3 0) scale(.78)"><path d="M13 3h6v9h9v6h-9v11h-6V18H4v-6h9z"/></g></g><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="876.0" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">The 