<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Crossillion - a daily Christian trivia game. The rarer your answer, the deeper you descend.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a1f"/><stop offset=".55" stop-color="#15104a"/><stop offset="1" stop-color="#090c28"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#c8872a"/></linearGradient>
