<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="The six rarity tiers and the depth each one is worth">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a1f"/><stop offset=".55" stop-color="#15104a"/><stop offset="1" stop-color="#090c28"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#c8872a"/></linearGradient>
  <linearGradient id="goldh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#8aa4ff" fill-opacity=".07"/></pattern><clipPath id="frame"><rect width="1000" height="430" rx="18"/></clipPath></defs>
<style>.seg{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.fade{animation:fade .7s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="1000" height="430" fill="url(#bg)"/><rect width="1000" height="430" fill="url(#scan)"/>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="54" font-size="12.5" font-weight="700" letter-spacing="3" fill="#c8a85a">SIX RARITY TIERS</text>
<rect x="48" y="68" width="56" height="3" rx="1.5" fill="url(#goldh)"/>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="98" font-size="14" fill="#c7cdf0">Every answer is ranked by how many people looked it up on Wikipedia. The rarer, the deeper it takes you.</text>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="116" font-size="10.5" font-weight="700" letter-spacing="2" fill="#8b9bd8">SHARE OF A QUESTION'S ANSWERS IN EACH TIER (MOST COMMON FIRST)</text>
<g class="seg" style="animation-delay:0.15s"><rect x="48.0" y="124" width="87.4" height="30" rx="6" fill="#8b93a7"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="91.7" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">10%</text></g><g class="seg" style="animation-delay:0.27s"><rect x="138.4" y="124" width="177.8" height="30" rx="6" fill="#7fb3d5"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="227.3" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">20%</text></g><g class="seg" style="animation-delay:0.39s"><rect x="319.2" y="124" width="223.0" height="30" rx="6" fill="#5fd0b8"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="430.7" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">25%</text></g><g class="seg" style="animation-delay:0.51s"><rect x="545.2" y="124" width="223.0" height="30" rx="6" fill="#f0b24a"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="656.7" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">25%</text></g><g class="seg" style="animation-delay:0.63s"><rect x="771.2" y="124" width="114.5" height="30" rx="6" fill="#ff7a55"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="828.5" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">13%</text></g><g class="seg" style="animation-delay:0.75s"><rect x="888.7" y="124" width="60.3" height="30" rx="6" fill="#d09bff"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="918.9" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#0b1020">7%</text></g>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="48" y="186" font-size="10.5" font-weight="700" letter-spacing="2" fill="#8b9bd8">TIER</text>
<text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="952" y="186" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="2" fill="#8b9bd8">DEPTH GAINED</text>
<g class="fade" style="animation-delay:0.50s"><rect x="48" y="200" width="14" height="14" rx="4" fill="#8b93a7"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="212" font-size="15" font-weight="800" fill="#8b93a7">Flock</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="212" font-size="13" fill="#c7cdf0">What the crowd says first</text><rect x="690" y="202" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:0.60s" x="690" y="202" width="16.0" height="9" rx="4.5" fill="#8b93a7"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="212" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+100 m</text></g><g class="fade" style="animation-delay:0.60s"><rect x="48" y="233" width="14" height="14" rx="4" fill="#7fb3d5"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="245" font-size="15" font-weight="800" fill="#7fb3d5">Pharisee</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="245" font-size="13" fill="#c7cdf0">Known, if you have been paying attention</text><rect x="690" y="235" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:0.70s" x="690" y="235" width="24.0" height="9" rx="4.5" fill="#7fb3d5"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="245" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+150 m</text></g><g class="fade" style="animation-delay:0.70s"><rect x="48" y="266" width="14" height="14" rx="4" fill="#5fd0b8"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="278" font-size="15" font-weight="800" fill="#5fd0b8">Sunday Schooler</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="278" font-size="13" fill="#c7cdf0">Solid church knowledge</text><rect x="690" y="268" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:0.80s" x="690" y="268" width="48.0" height="9" rx="4.5" fill="#5fd0b8"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="278" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+300 m</text></g><g class="fade" style="animation-delay:0.80s"><rect x="48" y="299" width="14" height="14" rx="4" fill="#f0b24a"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="311" font-size="15" font-weight="800" fill="#f0b24a">Seminarian</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="311" font-size="13" fill="#c7cdf0">You have studied this</text><rect x="690" y="301" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:0.90s" x="690" y="301" width="96.0" height="9" rx="4.5" fill="#f0b24a"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="311" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+600 m</text></g><g class="fade" style="animation-delay:0.90s"><rect x="48" y="332" width="14" height="14" rx="4" fill="#ff7a55"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="344" font-size="15" font-weight="800" fill="#ff7a55">Theologian</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="344" font-size="13" fill="#c7cdf0">A real deep cut</text><rect x="690" y="334" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:1.00s" x="690" y="334" width="136.0" height="9" rx="4.5" fill="#ff7a55"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="344" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+850 m</text></g><g class="fade" style="animation-delay:1.00s"><rect x="48" y="365" width="14" height="14" rx="4" fill="#d09bff"/><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="76" y="377" font-size="15" font-weight="800" fill="#d09bff">Burning Bush</text><text style="font-family:Montserrat,'Segoe UI','Helvetica Neue',Arial,sans-serif" x="258" y="377" font-size="13" fill="#c7cdf0">Almost nobody says this</text><rect x="690" y="367" width="160" height="9" rx="4.5" fill="#8aa4ff" fill-opacity=".1"/><rect class="seg" style="animation-delay:1.10s" x="690" y="367" width="160.0" height="9" rx="4.5" fill="#d09bff"/><text style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" x="952" y="377" text-anchor="end" font-size="14" font-weight="700" fill="#fff">+1,000 m</text></g></g>
<rect x=".5" y=".5" width="999" height="429" rx="18" fill="none" stroke="#f2c14e" stroke-opacity=".3"/>
</svg>
